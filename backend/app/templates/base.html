<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--muted:#667085;--line:#e4e7ec;--accent:#0b63ce;--err:#b42318;--ok:#067647}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171b23;--fg:#e6e8ec;--muted:#98a2b3;--line:#2a303b;--accent:#5aa2ff;--err:#f97066;--ok:#47cd89}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header a{color:var(--fg);text-decoration:none;font-weight:600}
main{max-width:720px;margin:32px auto;padding:0 16px}
footer{max-width:720px;margin:0 auto;padding:8px 16px 36px;text-align:center;border-top:1px solid var(--line)}
footer p{margin:6px 0}footer a{color:var(--accent);text-decoration:none}footer a:hover{text-decoration:underline}
footer .sep{margin:0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}
h1{font-size:22px;margin:0 0 16px}h2{font-size:17px;margin:0 0 12px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button,.btn{display:inline-block;margin-top:16px;padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
button.link{background:none;color:var(--accent);padding:0;margin:0;font-weight:500}
button.danger{background:none;color:var(--err);border:1px solid var(--line);padding:4px 10px;margin:0;font-size:14px}
.errors{color:var(--err);margin:0 0 8px;padding-left:18px}.muted{color:var(--muted);font-size:14px}
.notice{border-left:4px solid var(--accent);padding:10px 14px;background:var(--bg);border-radius:6px;margin-bottom:16px}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
.key{word-break:break-all;font-size:15px;padding:12px;border:1px dashed var(--ok);border-radius:8px;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.inline{display:inline}
.limit-row{display:grid;grid-template-columns:1fr auto 1.4fr;gap:8px;align-items:center;margin-top:8px}
</style>
</head>
<body>
<header>
  <a href="/">{{ app_name }}</a>
  {% if user %}
  <form class="inline" method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}">
    <span class="muted">{{ user.username }}</span> · <button class="link">Log out</button></form>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="muted">
  <p>Need help, or support for another store? <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
  <p><a href="/docs">API docs</a><span class="sep">·</span><a href="{{ source_url }}" rel="noopener">GitHub</a><span class="sep">·</span><a href="{{ source_url }}/blob/main/SECURITY.md" rel="noopener">Security</a><span class="sep">·</span><a href="{{ source_url }}/blob/main/LICENSE" rel="noopener">MIT license</a></p>
  <p>&copy; {{ year }} <a href="{{ company_url }}" rel="noopener">{{ company_name }}</a></p>
</footer>
</body>
</html>
