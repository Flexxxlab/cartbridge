{% extends "base.html" %}{% block title %}Sign up · {{ app_name }}{% endblock %}
{% block content %}<div class="card"><h1>Create an account</h1>{% include "_errors.html" %}
<form method="post" action="/signup"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Username</label><input name="username" value="{{ username or '' }}" autocomplete="username" required>
<label>Email</label><input name="email" type="email" value="{{ email or '' }}" autocomplete="email" required>
<label>Password</label><input name="password" type="password" minlength="8" autocomplete="new-password" required>
<label>Confirm password</label><input name="password2" type="password" minlength="8" autocomplete="new-password" required>
<button>Sign up</button></form>
<p class="muted">Already have an account? <a href="/login">Log in</a></p></div>{% endblock %}
