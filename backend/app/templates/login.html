{% extends "base.html" %}{% block title %}Log in · {{ app_name }}{% endblock %}
{% block content %}<div class="card"><h1>Log in</h1>{% include "_errors.html" %}
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Username</label><input name="username" value="{{ username or '' }}" autocomplete="username" required>
<label>Password</label><input name="password" type="password" autocomplete="current-password" required>
<button>Log in</button></form>
<p class="muted">{% if email_enabled %}<a href="/forgot">Forgot your password?</a>{% else %}{{ forgot_password }}{% endif %}</p>
<p class="muted">New here? <a href="/signup">Create an account</a></p></div>{% endblock %}
