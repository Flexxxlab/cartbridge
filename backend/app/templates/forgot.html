{% extends "base.html" %}{% block title %}Reset password · {{ app_name }}{% endblock %}
{% block content %}<div class="card"><h1>Reset your password</h1>
{% if email_enabled %}<p class="muted">Enter your account email and we'll send you a reset link.</p>
<form method="post" action="/forgot"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Email</label><input name="email" type="email" autocomplete="email" required>
<button>Send reset link</button></form>
{% else %}<p>{{ forgot_password }}</p>{% endif %}
<p class="muted"><a href="/login">Back to log in</a></p></div>{% endblock %}
