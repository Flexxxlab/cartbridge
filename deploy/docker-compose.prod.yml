services:
  cartbridge:
    build: ./backend
    container_name: cartbridge
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/cartbridge.db
      WALMART_PRIVATE_KEY_PATH: /run/secrets/walmart_key.pem
    volumes:
      - cartbridge_data:/data
      - ./walmart_key.pem:/run/secrets/walmart_key.pem:ro
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: cartbridge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cartbridge

volumes:
  cartbridge_data:
  caddy_data:
  caddy_config:
