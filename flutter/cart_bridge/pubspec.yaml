name: cart_bridge
description: Turn a list of ingredients into a filled store cart (Walmart first) and open it in a WebView or the store's app.
version: 0.1.0
repository: https://github.com/Flexxxlab/cartbridge/tree/main/flutter/cart_bridge
issue_tracker: https://github.com/Flexxxlab/cartbridge/issues
topics:
  - shopping
  - walmart
  - webview
  - recipes

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
